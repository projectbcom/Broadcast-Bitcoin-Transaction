name: TruffleHog Secret Scan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # This lets you run it manually with a button click

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for a thorough scan

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
