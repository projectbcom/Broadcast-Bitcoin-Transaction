name: Deep Search for DarkSignature

on:
  workflow_dispatch: # Run manually

jobs:
  deep-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history

      - name: Fetch All Hidden Branches and Tags
        run: |
          git fetch origin '+refs/*:refs/remotes/origin/*'

      - name: Search Every Git Object Ever Created
        run: |
          echo "--- SEARCHING ALL GIT OBJECTS FOR 'darksignature' ---"
          # This lists every single file (blob) ever committed
          git rev-list --all --objects | grep -i "darksignature" > results.txt
          
          if [ ! -s results.txt ]; then
            echo "❌ No Git objects found matching 'darksignature'."
          else
            cat results.txt
            echo "--- CHECKING OBJECT SIZES AND TYPES ---"
            while read sha path; do
              echo "Object: $path (Hash: $sha)"
              TYPE=$(git cat-file -t $sha)
              SIZE=$(git cat-file -s $sha)
              echo "Type: $TYPE, Size: $SIZE bytes"
              # Check if it's a binary executable (ELF header)
              if [ "$TYPE" == "blob" ]; then
                echo -n "First bytes: "
                git cat-file -p $sha | head -c 4 | xxd
              fi
              echo "-----------------------------------"
            done < results.txt
          fi

      - name: Check .gitignore and LFS
        run: |
          echo "--- .gitignore ---"
          cat .gitignore 2>/dev/null || echo "No .gitignore file"
          echo "--- .gitattributes (LFS) ---"
          cat .gitattributes 2>/dev/null || echo "No .gitattributes file"

      - name: Check GitHub Releases for the Binary
        run: |
          echo "--- CHECKING GITHUB RELEASES ---"
          curl -s https://api.github.com/repos/projectbcom/Broadcast-Bitcoin-Transaction/releases | grep -i "browser_download_url\|name"
