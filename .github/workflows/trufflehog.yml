name: Find Darksignature File

on:
  workflow_dispatch: # Run manually

jobs:
  find-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history

      - name: Fetch All Hidden Branches
        run: |
          git fetch origin '+refs/*:refs/remotes/origin/*'

      - name: Search All Commits for Darksignature
        run: |
          echo "--- SEARCHING ALL COMMITS FOR 'Darksignature' ---"
          # This searches every branch and every commit for the filename
          COMMITS=$(git log --all --oneline --name-only -- "*Darksignature*" -- "*darksignature*")
          
          if [ -z "$COMMITS" ]; then
            echo "❌ No commits found containing 'Darksignature'. The history may have been permanently wiped by GitHub."
            exit 0
          fi
          
          echo "$COMMITS"

      - name: Extract File Content
        run: |
          echo "--- EXTRACTING FILE CONTENT ---"
          # Find all unique commit hashes that touched the file
          COMMITS=$(git log --all --format="%H" -- "*Darksignature*" -- "*darksignature*")
          
          for commit in $COMMITS; do
            echo "========================================"
            echo "COMMIT: $commit"
            echo "========================================"
            
            # Find the exact file path in this specific commit
            FILEPATH=$(git ls-tree -r --name-only $commit | grep -i "darksignature")
            
            if [ -n "$FILEPATH" ]; then
              echo "Found file at path: $FILEPATH"
              echo "--- START FILE CONTENT ---"
              git show $commit:$FILEPATH
              echo "--- END FILE CONTENT ---"
            fi
          done
